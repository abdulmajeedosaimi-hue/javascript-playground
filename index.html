<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="profile-card">
      <h2 class="profile-name">Alex Morgan d 2</h2>
      <p class="profile-description">Frontend Developer</p>
      <p class="profile-status">Available for work</p>
      <button class="profile-button">Change Profile</button>
    </div>
    <div class="gallery">
      <img
        class="gallery-image"
        src="https://picsum.photos/id/10/500/300"
        alt="Forest"
      />

      <div class="gallery-buttons">
        <button class="gallery-button">Mountain</button>
        <button class="gallery-button">Beach</button>
        <button class="gallery-button">City</button>
      </div>

      <p class="gallery-description">Current image: Forest</p>
    </div>

    <div class="settings">
      <h2>Notification Settings</h2>

      <div class="setting">
        <p>Email Notifications</p>
        <button class="email-button">Enable</button>
      </div>

      <div class="setting">
        <p>Push Notifications</p>
        <button class="push-button">Enable</button>
      </div>

      <p class="settings-status">All notifications are disabled.</p>
    </div>
    <div class="product-card">
      <img
        class="product-image"
        src="https://picsum.photos/id/250/300/200"
        alt="Wireless headphones"
      />

      <h2 class="product-title">Wireless Headphones</h2>
      <p class="product-price">$89</p>
      <p class="product-stock">In stock</p>

      <button class="product-button">Add to Wishlist</button>
    </div>
    <div>
      <button onclick="document.body.style.backgroundColor = 'lightblue'">
        Change Background Color
      </button>
    </div>
    <div>
      <button onclick="document.body.style.backgroundColor = 'white'">
        revers
      </button>
    </div>
    <div>
      <button>click me</button>
    </div>
    <script defer src="script.js"></script>
  </body>
</html>
